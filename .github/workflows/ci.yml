name: ci
# Runs on PRs and main only — never on Discussion events. Channel traffic
# must not trigger CI (see AGENTS.md: "CI detonation on every message").
on:
  pull_request:
  push:
    branches: [main]

jobs:
  adapter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: adapter } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: adapter/package-lock.json }
      - run: npm ci
      - run: npm test

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: extension/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
